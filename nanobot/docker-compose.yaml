x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - /data/service_data/nanobot/config:/home/nanobot/.nanobot
  cap_drop:
    - ALL
  cap_add:
    - SYS_ADMIN
  security_opt:
    - apparmor=unconfined
    - seccomp=unconfined

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:${NANOBOT_PORT:-50019}:18790

  nanobot-cli:
    container_name: nanobot-cli
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
