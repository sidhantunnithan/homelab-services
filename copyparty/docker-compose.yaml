services:
  copyparty:
    image: copyparty/ac:1.20.24
    container_name: copyparty
    restart: unless-stopped
    ports:
      - 127.0.0.1:${COPYPARTY_PORT}:3923
    volumes:
      - /data/files:/data/files
      - /data/media:/data/media
      - /data/service_data/copyparty/config:/cfg
    environment:
      - TZ=Asia/Calcutta
      - PRTY_NO_DB_LOCK=1
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
