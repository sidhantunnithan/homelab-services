services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin
    user: 1000:1000
    restart: unless-stopped
    network_mode: 'host'
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /data/service_data/jellyfin/config:/config
      - /data/service_data/jellyfin/cache:/cache
      - /data/media:/media