services:
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin
    user: 1000:1000
    network_mode: 'host'
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ~/mounts/jellyfin/config:/config
      - ~/mounts/jellyfin/cache:/cache
      - ~/mounts/jellyfin/media:/media