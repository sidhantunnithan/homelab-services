services:
  element-web:
    image: vectorim/element-web:latest
    container_name: element-web
    restart: unless-stopped
    ports:
      - 127.0.0.1:${ELEMENT_WEB_PORT}:8080
    environment:
      - ELEMENT_WEB_PORT=8080
    volumes:
      - ./config.json:/app/config.json:ro
    logging:
      options:
        max-size: "10m"
