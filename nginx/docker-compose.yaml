services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - 127.0.0.1:${NGINX_PORT}:80
    volumes:
      - /data/service_data/nginx/pages:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      options:
        max-size: "10m"
