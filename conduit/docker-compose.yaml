services:
  conduit:
    image: matrixconduit/matrix-conduit:v0.10.15
    container_name: conduit
    restart: unless-stopped
    ports:
      - 127.0.0.1:${CONDUIT_PORT}:6167
    volumes:
      - /data/service_data/conduit/data:/var/lib/matrix-conduit
    environment:
      # Empty CONDUIT_CONFIG means configure from CONDUIT_* env vars only.
      CONDUIT_CONFIG: ''
      CONDUIT_SERVER_NAME: ${CONDUIT_SERVER_NAME}
      CONDUIT_DATABASE_BACKEND: rocksdb
      CONDUIT_DATABASE_PATH: /var/lib/matrix-conduit/
      CONDUIT_ADDRESS: 0.0.0.0
      CONDUIT_PORT: 6167
      CONDUIT_MAX_REQUEST_SIZE: 20000000
      # Registration requires the token; leave false except when adding accounts.
      CONDUIT_ALLOW_REGISTRATION: ${CONDUIT_ALLOW_REGISTRATION:-false}
      CONDUIT_REGISTRATION_TOKEN: ${CONDUIT_REGISTRATION_TOKEN}
      CONDUIT_ALLOW_FEDERATION: 'false'
      CONDUIT_ALLOW_CHECK_FOR_UPDATES: 'false'
      CONDUIT_TRUSTED_SERVERS: '[]'
      CONDUIT_WELL_KNOWN: '{client="https://${CONDUIT_SERVER_NAME}"}'
    logging:
      options:
        max-size: "10m"
    # Runs as 1000:1000 from the start; the host data dir is created 1000:1000.
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
