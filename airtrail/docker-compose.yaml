services:
  db:
    container_name: airtrail_db
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: airtrail
      POSTGRES_USER: airtrail
      POSTGRES_PASSWORD: ${AIRTRAIL_DB_PASSWORD}
    volumes:
      - /data/service_data/airtrail/data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airtrail -d airtrail']
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # postgres starts as root to fix data-dir ownership, then drops to postgres
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
  airtrail:
    container_name: airtrail
    image: johly/airtrail:v3.13.0
    restart: unless-stopped
    environment:
      ORIGINS: ${AIRTRAIL_LAN_ORIGIN},https://airtrail.internal.${BASE_DOMAIN}
      DB_URL: postgres://airtrail:${AIRTRAIL_DB_PASSWORD}@db:5432/airtrail
      DB_PASSWORD: ${AIRTRAIL_DB_PASSWORD}
      DB_DATABASE_NAME: airtrail
      DB_USERNAME: airtrail
      # Enables file uploads (airline icons). Disabled entirely when unset.
      UPLOAD_LOCATION: /app/uploads
    ports:
      - 127.0.0.1:${AIRTRAIL_PORT}:3000
    volumes:
      - /data/service_data/airtrail/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # Run as node (1000:1000) from the start. The entrypoint only chowns the
    # uploads dir and calls setpriv when it starts as root, so running as the
    # target user outright means it needs no capabilities at all - the host
    # directory is created 1000:1000 instead.
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
