services:
  freshrss:
    image: freshrss/freshrss:1.30.0
    container_name: freshrss
    restart: unless-stopped
    ports:
      - 127.0.0.1:${FRESHRSS_PORT}:80
    environment:
      - TZ=Asia/Calcutta
      - CRON_MIN=1,31
    volumes:
      - /data/service_data/freshrss/data:/var/www/FreshRSS/data
      - /data/service_data/freshrss/extensions:/var/www/FreshRSS/extensions
    logging:
      options:
        max-size: "10m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # apache binds :80 then drops to www-data; cron runs the feed refresh
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
