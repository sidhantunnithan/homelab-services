services:
  deluge:
    container_name: deluge
    image: linuxserver/deluge:2.2.0-ls382
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - DELUGE_LOGLEVEL=error #optional
    ports:
      - 127.0.0.1:${DELUGE_PORT}:8112
      - 127.0.0.1:6881:6881
      - 127.0.0.1:6881:6881/udp
      - 127.0.0.1:58846:58846 #optional
    volumes:
      - /data/service_data/deluge/config:/config
      - /data/service_data/deluge/downloads:/downloads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # s6-overlay starts as root and drops to PUID/PGID
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - SETGID
      - SETUID
