services:
  web:
    image: ghcr.io/karakeep-app/karakeep:0.26.0
    restart: unless-stopped
    volumes:
      - /data/service_data/karakeep/data:/data
    ports:
      - ${KARAKEEP_PORT}:3000  # host:docker
    env_file:
      - .env
    environment:
      MEILI_ADDR: http://meilisearch:7700
      BROWSER_WEB_URL: http://chrome:9222
      NEXTAUTH_SECRET: ${KARAKEEP_NEXTAUTH_SECRET}
      OPENAI_API_KEY: ${KARAKEEP_OPENAI_API_KEY}
      DATA_DIR: /data
  chrome:
    image: gcr.io/zenika-hub/alpine-chrome:124
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
  meilisearch:
    image: getmeili/meilisearch:v1.13.3
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${KARAKEEP_MEILI_MASTER_KEY}
    volumes:
      - /data/service_data/karakeep/meilisearch:/meili_data
