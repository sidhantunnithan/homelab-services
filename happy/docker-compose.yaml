services:
  db:
    container_name: happy_db
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: happy-server
      POSTGRES_USER: happy
      POSTGRES_PASSWORD: ${HAPPY_DB_PASSWORD}
    volumes:
      - /data/service_data/happy/db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U happy -d happy-server']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: happy_redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /data/service_data/happy/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  happy:
    container_name: happy
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://happy:${HAPPY_DB_PASSWORD}@db:5432/happy-server
      REDIS_URL: redis://redis:6379
      HANDY_MASTER_SECRET: ${HAPPY_SEED}
      PORT: "3000"
    ports:
      - 127.0.0.1:${HAPPY_PORT}:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
